[project]
name = "case-deck"
version = "0.1.2"
description = "Claude Code skill: build, edit, review and navigate case competition decks in the house style"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-pptx==1.0.2",
    "lxml>=4.9",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "pypdf>=4.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false   # a folder of scripts, not an installable package
