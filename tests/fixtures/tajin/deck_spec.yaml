- pattern: risk_matrix
  section: Impact
  top_risks:
  - 1
  - 4
  - 6
  slots:
    title: Address brand identity dilution, greenwashing accusation and community fatigue risks
    tracker: Impact
    legend1: Sabores
    legend2: Alma
    legend3: Llegada
    r1_name: Identity dilution
    r2_name: Partnership dependence
    r3_name: Export compliance
    r4_name: Greenwashing accusations
    r5_name: Recycling complexity
    r6_name: Community fatigue
    r7_name: Execution inconsistency
    r1_desc: Eroding Tajín’s Mexican authenticity as the brand adapts to new international flavors and packaging aesthetics,
      weakening emotional ties
    r2_desc: Relying heavily on external snack or distribution partners could limit Tajín’s control over key strategic choices
      and marketing
    r3_desc: Import regulations such as ingredient restrictions, FDA labeling, or additive rules could delay expansion or
      force reformulations
    r4_desc: If sustainability claims in programs are perceived as symbolic, Gen Z audiences may question Tajín’s commitment
      to sustainability
    r5_desc: Inconsistent collection or farmer participation could increase costs and undercut sustainability targets
    r6_desc: New initiatives risk oversaturating loyal followers, causing declining engagement and diminishing brand building
      efforts
    r7_desc: Pop-up events executed by multiple regional vendors may produce uneven quality or messaging, weakening Tajín’s
      perception
    source: 'Source: Team Analysis'
