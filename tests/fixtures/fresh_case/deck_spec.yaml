    source: "Source: Provided case (2026); Team Analysis"

- pattern: risk_matrix
  section: Impact
  top_risks: [1, 3]
  slots:
    title: Brand dilution, a bad climate year and apprentices leaving are the main risks
    legend1: Raíz
    legend2: Encuentro
    legend3: Oficio
    r1_name: Brand dilution
    r1_desc: A club and tourism push could make Alma feel less exclusive to its loyal buyers
    r2_name: Bad climate year
    r2_desc: A very hot, dry year could hit yields before the altitude plantings mature
    r3_name: Apprentices leave
    r3_desc: Trained apprentices may move to cities or other wineries after the programme
    r4_name: Tourism capacity
    r4_desc: Estates and villages may not have the rooms or staff for more visitors
    source: "Source: Team Analysis"

- pattern: mitigation
  section: Impact
  slots:
    title: Protect the brand with limited club places, phase planting by estate and tie apprentices to jobs
    m1_letter: A
    m2_letter: B
    m3_letter: C
    m1_name: Brand dilution
    m2_name: Bad climate year
    m3_name: Apprentices leave
    m1_mitigation: Keep the club **small and by invitation**, priced in line with the top wines
    m2_mitigation: Plant at altitude first and **spread the pilot** across two harvests
    m3_mitigation: Offer the best apprentices a **job and housing** in the village
    m1_steps: ["Cap places at 1,500 in year 1", "Same price as the estate shop"]
    m2_steps: [Altitude plots first, Insurance for the pilot estate]
    m3_steps: [Job offer to the top third, Housing support with the town hall]
    source: "Source: Team Analysis"

