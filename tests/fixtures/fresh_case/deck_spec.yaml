# Fresh-case test: IE Business Case Competition 2026, Alma Carraovejas (5H).
# Written from team_notes.md and the approved storyline.md. Numbers from the
# provided case are sourced; estimates carry [ASSUMPTION].
deck:
  title: Raíz y Futuro
  client: Alma Carraovejas
  output: alma_deck.pptx

slides:
- pattern: title
  slots:
    title: Raíz y Futuro
    m1_name: Ana
    m2_name: Ben
    m3_name: Carla
    m4_name: Diego

- pattern: exec_summary
  section: Executive Summary
  slots:
    question: How can Alma Carraovejas grow for the next five years without losing its artisanal soul, as climate, drinking habits and rural talent change?
    c1_head: Raíz
    c2_head: Encuentro
    c3_head: Oficio
    c1_question: Which climate investments protect quality on all six estates?
    c2_question: How do we win millennials and Gen Z without diluting the brand?
    c3_question: How do we bring young people into winemaking in rural Spain?
    c1_reco: ["**Viñedo de Altura**", "Move new plantings to high-altitude plots and pilot regenerative practice on one estate"]
    c2_reco: ["**Club Encuentro**", "A members' club of tastings, harvest days and direct sales for 25-40 year olds"]
    c3_reco: ["**Escuela de Oficio**", "Paid harvest apprenticeships and a one-year academy with local schools"]
    impact: "Impact: USD ~3.5m extra revenue by 2030 [ASSUMPTION]"
    source: "Source: Provided case (2026); Team Analysis"

- pattern: section_divider
  slots: {section: Analysis, presenter: Ana}

- pattern: company_position
  section: Analysis
  slots:
    title: Alma Carraovejas earns a 74% gross margin from six estates, but relies on an ageing customer base
    left_head: While Alma leads in craft and terroir…
    right_head: …it must now decide where to grow next
    stat1_value: "6"
    stat1_label: Wine estates in Spain
    stat2_value: 32.1m
    stat2_label: USD revenue in 2024 (+4%)
    stat3_value: "206"
    stat3_label: Employees in 2024
    strength1: Premium estates with a 74% gross margin
    strength2: A Michelin-starred restaurant and wine tourism that build the brand
    strength3: Own distribution and long-term family ownership
    comp_head: Core Competencies
    comp1: Terroir-driven winemaking
    comp2: Gastronomy and hospitality
    comp3: Long-term stewardship
    map_head: Brand fit
    map_x: Growth potential
    map1: Altitude estates
    map2: Wine tourism
    map3: Direct-to-consumer club
    map4: Talent academy
    map5: New regions abroad
    map6: Volume wines
    source: "Source: Provided case (2026), Orbis financial statements 2023-2024"

- pattern: trends
  section: Analysis
  slots:
    title: Drought, lower drinking and a generational gap put pressure on Spanish premium wine
    t1_head: Climate pressure
    t1_stat1: 28.45m
    t1_label1: hl harvest in 2023/24, cut by drought
    t1_stat2: 1,076m
    t1_label2: Altitude of the Milsetentayseis estate
    t1_takeaway: Altitude is a hedge Alma already owns
    t2_head: Drinking less
    t2_stat1: 24 L
    t2_label1: Wine per person per year in Spain
    t2_stat2: 20%
    t2_label2: Of consumption from people under 40
    t2_takeaway: Volume will not grow at home
    t3_head: A new generation
    t3_stat1: 31%
    t3_label1: Of drinkers are millennials (boomers 26%)
    t3_stat2: 44%
    t3_label2: Of millennial drinkers are highly involved
    t3_takeaway: Millennials buy fewer, better bottles
    source: "Source: Provided case (2026): MAPA, Silicon Valley Bank 2024, Wine Market Council 2025"

- pattern: hook_image
  notes: "Hook: 1982, Segovia. José María Ruiz Benito replaces the jug with a bottle at his restaurant. Ask: what is the next jug?"

- pattern: three_cards
  section: Analysis
  takeaway: Alma can grow by **selling experiences, not volume**, from estates that are **already climate-ready**
  slots:
    title: Alma can grow where its altitude estates, its experiences and its rural roots meet new demand
    subtitle: Where do Alma's strengths meet the market's best opportunities?
    c1_text: ["## Climate-ready terroir", "", "High-altitude estates protect quality in hot years: **altitude is a growth asset**"]
    c2_text: ["## Experiences over volume", "", "Millennials want **fewer, better bottles** and stories they can visit"]
    c3_text: ["## Rural roots", "", "Estates without successors show the **talent gap** is also a brand story"]
    source: "Source: Provided case (2026); Team Analysis"

- pattern: section_divider
  slots: {section: Strategy, presenter: Ben & Carla}

- pattern: framework
  section: Strategy
  slots:
    title: A Raíz y Futuro strategy to grow Alma Carraovejas
    subtitle: Three pillars that grow value per bottle while keeping the artisanal identity
    p1_text: ["## Raíz", "How do we turn climate risk into a quality advantage?"]
    p2_text: ["## Encuentro", "How do we win the next generation of drinkers?"]
    p3_text: ["## Oficio", "How do we bring young talent to rural winemaking?"]
    source: "Source: Team Analysis"

