- pattern: initiative_steps
  section: Raíz
  slots:
    title: Make altitude the core of Alma's climate plan, piloting regenerative practice on one estate before all six
    subtitle: Protect quality in hot, dry years and turn it into a story buyers can taste
    breakdown_head: Breakdown of “Viñedo de Altura”
    s1_name: ["Map", "& Choose"]
    s2_name: ["Pilot", "& Measure"]
    s3_name: ["Scale", "& Certify"]
    s1_text: ["Map water stress on all six estates", "Pick one pilot estate", "Set quality and yield targets"]
    s2_text: ["Cover crops and water capture", "Plant at altitude first", "Measure yield and quality yearly"]
    s3_text: ["Roll out to the other estates", "Publish results with the B Corp report"]
    target_stat: "1,076"
    target_label: ["", "", "Metres: altitude of Milsetentayseis, the model"]
    kpi1: ["## Yield stability", "Change in yield in dry years vs average"]
    kpi2: ["## Water per litre", "Litres of water used per litre of wine"]
    source: "Source: Provided case (2026); Team Analysis"

- pattern: framework
  current: 2
  section: Strategy
  slots:
    title: A Raíz y Futuro strategy to grow Alma Carraovejas
    subtitle: Three pillars that grow value per bottle while keeping the artisanal identity
    p1_text: ["## Raíz", "How do we turn climate risk into a quality advantage?"]
    p2_text: ["## Encuentro", "How do we win the next generation of drinkers?"]
    p3_text: ["## Oficio", "How do we bring young talent to rural winemaking?"]
    source: "Source: Team Analysis"

- pattern: initiative
  section: Encuentro
  slots:
    title: Win millennials with Club Encuentro, a members' club that turns visits into direct sales
    breakdown_head: Breakdown of “Club Encuentro”
    b1_text: "**Membership** for 25-40 year olds: two estate days a year and a box of three wines"
    b2_text: "**Harvest weekends** and tastings with the winemakers, booked online"
    b3_text: "**Direct sales** through the club, with smaller formats and stories on every label"
    kpis: ["## Members", "Paying members after year 1 (target 1,500 [ASSUMPTION])", "",
           "## Repeat purchase", "% of members buying again within 6 months (target 50%)", "",
           "## Direct sales share", "% of revenue sold direct (target +5 points by 2030)"]
    source: "Source: Team Analysis"

- pattern: framework
  current: 3
  section: Strategy
  slots:
    title: A Raíz y Futuro strategy to grow Alma Carraovejas
    subtitle: Three pillars that grow value per bottle while keeping the artisanal identity
    p1_text: ["## Raíz", "How do we turn climate risk into a quality advantage?"]
    p2_text: ["## Encuentro", "How do we win the next generation of drinkers?"]
    p3_text: ["## Oficio", "How do we bring young talent to rural winemaking?"]
    source: "Source: Team Analysis"

- pattern: initiative
  section: Oficio
  slots:
    title: Grow the next winemakers with Escuela de Oficio, paid apprenticeships linked to local schools
    breakdown_head: Breakdown of “Escuela de Oficio”
    b1_text: "**Paid harvest apprenticeships** for students from the estates' own regions"
    b2_text: "**One-year academy** with local vocational schools and a job offer for the best"
    b3_text: "**Housing support** in the villages so young staff can stay"
    kpis: ["## Apprentices hired", "Apprentices who join Alma after the programme (target 30%)", "",
           "## Harvest staffing", "% of harvest roles filled on time", "",
           "## Local hires", "% of new hires from the estates' regions"]
    source: "Source: Provided case (2026); Team Analysis"

- pattern: section_divider
  slots: {section: Impact, presenter: Diego}

- pattern: driver_tree
  section: Impact
  slots:
    title: To estimate impact, we link each initiative to the drivers of Alma's annual revenue
    root: Annual Revenue
    d1: Bottles sold
    d2: Direct share
    d3: Price per bottle
    a1: Raíz
    a2: Encuentro
    a3: Oficio
    a1_s1: Viñedo de Altura
    a1_s1_driver: "3"
    a2_s1: Club Encuentro
    a2_s1_driver: "2"
    a2_s2: Harvest weekends
    a2_s2_driver: "1"
    a3_s1: Escuela de Oficio
    a3_s1_driver: "1"
    footnote: "Footnote: Oficio protects volume (harvest staffing); its revenue effect is counted under bottles sold"
    source: "Source: Team Analysis"

- pattern: financials
  section: Impact
  slots:
    title: Raíz y Futuro adds about USD 3.5m of revenue by 2030 and pays back in about three years [ASSUMPTION]
    subtitle: We forecast revenue of USD ~41m by 2030, from USD 32.1m in 2024
    kpi1_value: USD 3.5m
    kpi1_label: Revenue creation
    kpi2_value: 1.9x
